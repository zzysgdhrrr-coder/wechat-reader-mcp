[project]
name = "wechat-reader-mcp"
version = "0.1.0"
description = "MCP server: read public WeChat Official Account articles, view their images locally"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0",
    "playwright>=1.40",
    "requests>=2.28",
    "idna>=3.6",
    "Pillow>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []
bypass-selection = true
